name: Secret Scan

# Standalone secret-scanning gate, independent of the botanika-ci-templates
# build/deploy rollout (docs/ci-cd/, still mid-rollout and not yet reaching
# this repo). Closes PAD P0-SEC-01 required action #8 ("Add secret scanning
# to CI") without depending on that rollout's Jira-branch-naming or
# build/deploy conventions.
on:
  push:
    branches: [main, staging, prod, magic_block_v2]
  pull_request:

jobs:
  gitleaks:
    name: gitleaks (fail on any detected secret)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # Shallow on purpose: full history (fetch-depth 0) would permanently
          # re-flag the 4 already-known, already-rotated secrets from P0-SEC-01
          # whose history-rewrite is pending separate explicit approval (see
          # docs/Botanika_PAD_P0-SEC-01_Inventory_And_Incident_Note.md). This
          # gate exists to catch NEW secrets going forward, not to re-litigate
          # the known/tracked incident on every push.
          fetch-depth: 2

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
