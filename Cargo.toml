[workspace]
members = [
    "programs/*"
]
resolver = "2"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

[dev-dependencies]
anchor-lang = "0.31.1"
solana-program-test = "1.18.17"
solana-sdk = "1.18.17"
tokio = { version = "1.36", features = ["macros", "rt-multi-thread"] }
spl-token = "4.0.0"
anchor-spl = "0.31.1"
